<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Inkwell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: "#FAF6EF",
            surface: "#FFFFFF",
            ink: "#23201C",
            muted: "#6B635A",
            clay: { DEFAULT: "#C4552D", dark: "#A6441F", soft: "#F3E0D6" },
            sage: { DEFAULT: "#5F7A61", soft: "#E4ECE3" },
            edge: "#E8E0D3",
          },
          fontFamily: {
            display: ["Fraunces", "Georgia", "serif"],
            sans: ["Inter", "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-paper font-sans text-ink">
  <div id="navbar"></div>

  <main class="relative grid min-h-[calc(100vh-73px)] place-items-center overflow-hidden px-4 py-16">
    <div class="pointer-events-none absolute -left-24 top-10 h-72 w-72 rounded-full bg-clay-soft/60 blur-3xl"></div>
    <div class="pointer-events-none absolute -right-20 bottom-0 h-80 w-80 rounded-full bg-sage-soft/70 blur-3xl"></div>

    <div class="relative w-full max-w-md rounded-3xl border border-edge bg-surface p-10 shadow-xl">
      <div class="mb-8 text-center">
        <p class="text-xs font-semibold uppercase tracking-[0.25em] text-clay">Welcome back</p>
        <h1 class="mt-3 font-display text-4xl font-semibold">Log in to Inkwell</h1>
        <p class="mt-2 text-muted">Pick up where you left off.</p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label for="email" class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-muted">Email</label>
          <input type="email" id="email" required placeholder="you@example.com"
            class="w-full rounded-xl border border-edge bg-paper px-4 py-3 text-ink placeholder-muted/60 transition focus:border-clay focus:outline-none focus:ring-2 focus:ring-clay/25">
          <div id="emailError" class="mt-1.5 hidden text-sm text-clay"></div>
        </div>

        <div>
          <label for="password" class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-muted">Password</label>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full rounded-xl border border-edge bg-paper px-4 py-3 text-ink placeholder-muted/60 transition focus:border-clay focus:outline-none focus:ring-2 focus:ring-clay/25">
          <div id="passwordError" class="mt-1.5 hidden text-sm text-clay"></div>
        </div>

        <button type="submit"
          class="w-full rounded-xl bg-ink py-3 font-semibold text-paper transition hover:bg-clay">
          Login
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-muted">
        New here?
        <a href="/register.html" class="font-semibold text-clay hover:underline">Create an account</a>
      </p>
    </div>
  </main>

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

  <script type="module" src="/js/navbar.js"></script>
  <script type="module">
    import { showToast, setLoading, clearErrors, showFieldErrors } from "/js/auth.js";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearErrors();

      const btn = e.target.querySelector("button[type=submit]");
      setLoading(btn, true);

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          if (data.errors) {
            showFieldErrors(data.errors);
          } else {
            showToast(data.error, "error");
          }
          setLoading(btn, false);
          return;
        }

        showToast(data.message, "success");
        setTimeout(() => {
          window.location.href = "/home.html";
        }, 600);
      } catch {
        showToast("Something went wrong. Please try again.", "error");
        setLoading(btn, false);
      }
    });
  </script>
</body>
</html>
